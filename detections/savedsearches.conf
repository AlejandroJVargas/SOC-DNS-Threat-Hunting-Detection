[default]
disabled = 0

[SOC_ALERT_01_High_Frequency_DNS_Beaconing]
description = Detects excessive volume of DNS queries from a single internal source, indicating potential C2 beaconing (MITRE T1071.004).
search = sourcetype="zeek_dns" NOT "#*" \
| rex "^(?<ts>[^\t\s]+)\s+(?<uid>[^\t\s]+)\s+(?<src_ip>[^\t\s]+)\s+(?<src_port>[^\t\s]+)\s+(?<dest_ip>[^\t\s]+)\s+(?<dest_port>[^\t\s]+)\s+(?<proto>[^\t\s]+)\s+(?<trans_id>[^\t\s]+)\s+(?<query>[^\t\s]+)" \
| stats count by src_ip \
| where count > 50000
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4

[SOC_ALERT_02_Reverse_DNS_Reconnaissance_Scan]
description = Identifies internal hosts executing failed reverse DNS lookups (.in-addr.arpa) generating high NXDOMAIN rates (MITRE T1590.002).
search = sourcetype="zeek_dns" "NXDOMAIN" NOT "#*" \
| rex "^(?<ts>[^\t\s]+)\s+(?<uid>[^\t\s]+)\s+(?<src_ip>[^\t\s]+)\s+(?<src_port>[^\t\s]+)\s+(?<dest_ip>[^\t\s]+)\s+(?<dest_port>[^\t\s]+)\s+(?<proto>[^\t\s]+)\s+(?<trans_id>[^\t\s]+)\s+(?<query>[^\t\s]+)\s+(?<qclass>[^\t\s]+)\s+(?<qclass_name>[^\t\s]+)\s+(?<qtype>[^\t\s]+)\s+(?<qtype_name>[^\t\s]+)\s+(?<rcode>[^\t\s]+)\s+(?<rcode_name>[^\t\s]+)" \
| search query="*.in-addr.arpa" OR rcode_name="NXDOMAIN" \
| stats count by src_ip, query \
| where count > 1000
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3

[SOC_ALERT_03_DNS_Tunneling_Exfiltration_Tuned]
description = Detects long DNS queries (>50 chars) associated with exfiltration while excluding local ISP search suffix false positives (MITRE T1048.003).
search = sourcetype="zeek_dns" NOT "#*" \
| rex "^(?<ts>[^\t\s]+)\s+(?<uid>[^\t\s]+)\s+(?<src_ip>[^\t\s]+)\s+(?<src_port>[^\t\s]+)\s+(?<dest_ip>[^\t\s]+)\s+(?<dest_port>[^\t\s]+)\s+(?<proto>[^\t\s]+)\s+(?<trans_id>[^\t\s]+)\s+(?<query>[^\t\s]+)" \
| eval query_length=len(query) \
| where query_length > 50 \
| search NOT query="*.comcast.net" AND NOT query="*.local" \
| stats count by src_ip, query, query_length \
| where count > 10
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
